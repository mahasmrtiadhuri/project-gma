<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App icon for the Generative Micro-Climate Architect PWA.
       Amber sun + glass-tower silhouette in the project's color
       palette (#F59E0B / #3B82F6 / #1E3A8A). -->
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB84D" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Rounded square background (iOS / Android both clip to their own
       shape; this just guarantees a colored fill behind transparent areas
       when the OS displays a square preview). -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#sky)" />

  <!-- Sun -->
  <circle cx="160" cy="180" r="76" fill="url(#sun)" />

  <!-- Glass tower (foreground silhouette, deep blue) -->
  <path
    d="M 220 480 L 220 220 L 300 200 L 300 480 Z"
    fill="#1E3A8A"
  />
  <!-- Window grid -->
  <g fill="#3B82F6" opacity="0.85">
    <rect x="232" y="240" width="20" height="20" />
    <rect x="262" y="236" width="20" height="20" />
    <rect x="232" y="276" width="20" height="20" />
    <rect x="262" y="272" width="20" height="20" />
    <rect x="232" y="312" width="20" height="20" />
    <rect x="262" y="308" width="20" height="20" />
    <rect x="232" y="348" width="20" height="20" />
    <rect x="262" y="344" width="20" height="20" />
    <rect x="232" y="384" width="20" height="20" />
    <rect x="262" y="380" width="20" height="20" />
    <rect x="232" y="420" width="20" height="20" />
    <rect x="262" y="416" width="20" height="20" />
  </g>

  <!-- Second taller tower behind -->
  <path
    d="M 320 480 L 320 140 L 400 120 L 400 480 Z"
    fill="#1E3A8A"
    opacity="0.75"
  />
  <g fill="#3B82F6" opacity="0.6">
    <rect x="332" y="170" width="18" height="18" />
    <rect x="360" y="166" width="18" height="18" />
    <rect x="332" y="206" width="18" height="18" />
    <rect x="360" y="202" width="18" height="18" />
    <rect x="332" y="242" width="18" height="18" />
    <rect x="360" y="238" width="18" height="18" />
    <rect x="332" y="278" width="18" height="18" />
    <rect x="360" y="274" width="18" height="18" />
    <rect x="332" y="314" width="18" height="18" />
    <rect x="360" y="310" width="18" height="18" />
    <rect x="332" y="350" width="18" height="18" />
    <rect x="360" y="346" width="18" height="18" />
    <rect x="332" y="386" width="18" height="18" />
    <rect x="360" y="382" width="18" height="18" />
    <rect x="332" y="422" width="18" height="18" />
    <rect x="360" y="418" width="18" height="18" />
  </g>

  <!-- Specular glare highlight on near tower (the headline effect) -->
  <path
    d="M 222 230 L 260 222 L 260 280 L 222 290 Z"
    fill="#F59E0B"
    opacity="0.55"
  />
</svg>
